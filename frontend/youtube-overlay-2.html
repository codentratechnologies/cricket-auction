<script>
  // ── Scaling ──────────────────────────────────────────────────────────────
  function scaleOverlay() {
    const root    = document.getElementById('overlay-root');
    const wrapper = document.getElementById('overlay-wrapper');
    const DESIGN_WIDTH   = 1380;
    const DESIGN_HEIGHT  = 200;
    const vw = wrapper.clientWidth;
    const vh = wrapper.clientHeight;
    const scale    = (vw * 0.95) / DESIGN_WIDTH;
    const visualW  = DESIGN_WIDTH * scale;
    const visualH  = DESIGN_HEIGHT * scale;
    const left = (vw - visualW) / 2;
    const top  = (vh - visualH) / 2;
    root.style.left            = left + 'px';
    root.style.top             = top  + 'px';
    root.style.transform       = `scale(${scale})`;
    root.style.transformOrigin = 'top left';
  }
  window.addEventListener('resize', scaleOverlay);

  // ── Firebase Live Data ────────────────────────────────────────────────────
  const urlParams   = new URLSearchParams(window.location.search);
  const auctionCode = urlParams.get('code') || urlParams.get('auction_id');
  const API_BASE    = 'http://127.0.0.1:5000/api';

  // Helper: format number as Indian currency string
  function formatINR(amount) {
    return Number(amount || 0).toLocaleString('en-IN');
  }

  // Helper: split a full team name into two lines (word 1 / rest)
  function splitTeamName(name) {
    const words = (name || 'TEAM').toUpperCase().split(' ');
    return { line1: words[0], line2: words.slice(1).join(' ') || '' };
  }

  let previousStatus = null;

  // Update every DOM element with fresh data
  function updateOverlay(data) {
    const rootEl = document.getElementById('overlay-root');
    
    // 1. Check if waiting for next player
    if (!data || !data.status || data.status === 'waiting') {
      rootEl.style.opacity = '0'; // Hide overlay smoothly
      previousStatus = 'waiting';
      return;
    }
    
    // Make sure overlay is visible if active/sold/unsold
    rootEl.style.opacity = '1';

    // ── Player Info ──
    if (data.currentPlayer) {
      const p = data.currentPlayer;

      // Name — two-colour split
      const nameEl = document.getElementById('overlayPlayerName');
      const nameParts = (p.name || 'PLAYER NAME').toUpperCase().split(' ');
      const lastName  = nameParts.pop();
      const firstName = nameParts.join(' ');
      nameEl.innerHTML = `<span class="text-[#0f172a]">${firstName}</span><span class="text-[#ea580c] ml-1.5">${lastName}</span>`;

      // Photo
      const photoEl = document.getElementById('overlayPlayerPhoto');
      if (p.image) {
          photoEl.src = p.image;
          photoEl.style.width = '260px';
          photoEl.style.height = '260px';
          photoEl.style.top = '-75px';
          photoEl.style.left = '-29px';
          photoEl.style.objectFit = 'contain';
      } else {
          photoEl.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(p.name||'P')}&background=b8d4f0&color=1e3a8a&size=300`;
          photoEl.style.width = '100%';
          photoEl.style.height = '100%';
          photoEl.style.top = '0px';
          photoEl.style.left = '0px';
          photoEl.style.objectFit = 'cover';
      }

      // Role & Age
      const roleEl = document.getElementById('overlayPlayerRole');
      if (roleEl) roleEl.textContent = (p.role || 'PLAYER').toUpperCase();

      const ageEl = document.getElementById('overlayPlayerAge');
      if (ageEl) ageEl.textContent = 'AGE ' + (p.age || '--');

      // Batting & Bowling style
      const batEl  = document.getElementById('overlayBattingStyle');
      if (batEl)  batEl.textContent  = (p.batting_style  || p.batting  || 'RIGHT HAND BAT').toUpperCase();

      const bowlEl = document.getElementById('overlayBowlingStyle');
      if (bowlEl) bowlEl.textContent = (p.bowling_style  || p.bowling  || 'RIGHT ARM SPIN').toUpperCase();
    }

    // ── Bid Info ──
    if (data.currentBid) {
      const b = data.currentBid;

      // Bid amount
      const bidValEl = document.getElementById('overlayBidValue');
      if (bidValEl) bidValEl.textContent = formatINR(b.amount || 0);

      // Bidding team
      if (b.teamName) {
        const { line1, line2 } = splitTeamName(b.teamName);
        const t1 = document.getElementById('overlayTeamName1');
        const t2 = document.getElementById('overlayTeamName2');
        if (t1) t1.textContent = line1;
        if (t2) t2.textContent = line2;

        // Team logo or generated fallback initials
        const logoContainer = document.getElementById('overlayTeamLogoContainer');
        if (logoContainer) {
          const initials = b.teamShortName || line1 || 'T';
          const logoUrl = b.teamLogo || `https://ui-avatars.com/api/?name=${encodeURIComponent(initials)}&background=3b82f6&color=ffffff&size=150`;
          logoContainer.innerHTML = `<img src="${logoUrl}" alt="Team Logo" class="w-14 h-14 object-cover rounded-full shadow-md border-2 border-white">`;
        }
      } else {
        const t1 = document.getElementById('overlayTeamName1');
        const t2 = document.getElementById('overlayTeamName2');
        if (t1) t1.textContent = 'WAITING';
        if (t2) t2.textContent = 'FOR BIDS';
        
        const logoContainer = document.getElementById('overlayTeamLogoContainer');
        if (logoContainer) logoContainer.innerHTML = '';
      }
    }
    
    // ── STATUS ANIMATIONS (ACTIVE / SOLD / UNSOLD) ──
    const statusStamp = document.getElementById('overlayStatusStamp');
    const statusText = document.getElementById('overlayStatusText');
    const playerPhoto = document.getElementById('overlayPlayerPhoto');
    const livePillBg = document.getElementById('overlayLivePillBg');
    const livePillText = document.getElementById('overlayLivePillText');
    const liveDot = document.getElementById('overlayLiveDot');
    
    const bidLabelText = document.getElementById('overlayBidLabelText');
    const bidCountingBg = document.getElementById('overlayBidCountingBg');
    const bidCountingText = document.getElementById('overlayBidCountingText');
    
    const podOuter = document.getElementById('overlayPodOuter');
    const orbitRing = document.getElementById('overlayOrbitRing');
    const gavelBadge = document.getElementById('overlayGavelBadge');
    
    const rightWing = document.getElementById('overlayRightWing');
    const rwLine1 = document.getElementById('overlayRightWingLine1');
    const rwLine2 = document.getElementById('overlayRightWingLine2');
    const rwLabel = document.getElementById('overlayRightWingLabel');
    const endcap = document.getElementById('overlayEndcap');
    const endcapText = document.getElementById('overlayEndcapText');
    const shelfBar = document.getElementById('overlayShelfBar');

    if (data.status === 'sold') {
      // Apply Sold Visuals (Green Theme)
      playerPhoto.classList.remove('player-grayscale');
      statusText.textContent = 'SOLD';
      statusStamp.className = "absolute bottom-2 right-2 bg-gradient-to-r from-emerald-600 to-emerald-500 px-3 py-0.5 rounded shadow-lg border border-emerald-200/50 transform -rotate-3 transition-colors duration-500";
      
      livePillBg.className = "flex items-center gap-2 bg-[#064e3b] border border-emerald-400/60 py-1.5 px-4 rounded-full shadow-md flex-shrink-0 transition-colors duration-500";
      livePillText.textContent = "PLAYER SOLD";
      liveDot.className = "relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500 shadow-[0_0_8px_#10b981] live-dot-pulse transition-colors duration-500";
      liveDot.previousElementSibling.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75";
      
      bidLabelText.textContent = "SOLD TO";
      bidLabelText.className = "text-[10px] font-extrabold uppercase tracking-[0.25em] text-emerald-400 mt-2 mb-0.5 transition-colors duration-500";
      
      bidCountingBg.className = "mt-2 w-[85%] bg-emerald-600 py-0.5 px-2 rounded-full border border-emerald-300/40 shadow-sm flex items-center justify-center transition-all duration-500";
      bidCountingText.textContent = "FINAL PRICE";
      
      podOuter.className = "relative w-[198px] h-[198px] rounded-full p-[6px] bg-gradient-to-b from-emerald-400 via-emerald-600 to-emerald-800 pod-orbit-glow flex items-center justify-center transition-colors duration-500";
      orbitRing.className = "absolute w-[212px] h-[212px] rounded-full border-2 border-emerald-500 border-dashed animate-[spin_45s_linear_infinite] opacity-70 pointer-events-none transition-colors duration-500";
      gavelBadge.className = "absolute -top-3 w-8 h-8 rounded-full bg-gradient-to-tr from-emerald-500 to-emerald-400 border-2 border-white flex items-center justify-center shadow-lg transition-colors duration-500";
      
      rightWing.className = "relative flex-1 bg-gradient-to-r from-[#064e3b] via-[#022c22] to-[#064e3b] clip-right-wing pl-10 pr-24 flex items-center justify-between border-t-2 border-b-2 border-emerald-500 shadow-[0_10px_25px_rgba(0,0,0,0.8)] z-10 transition-colors duration-500";
      rwLine1.className = "h-[1.5px] w-6 bg-emerald-500 transition-colors duration-500";
      rwLine2.className = "h-[1.5px] w-6 bg-emerald-500 transition-colors duration-500";
      rwLabel.className = "text-[10px] font-black uppercase tracking-[0.25em] text-emerald-400 transition-colors duration-500";
      
      endcap.className = "absolute right-0 top-0 bottom-0 w-[90px] bg-[#f8fafc] clip-endcap flex flex-col items-center justify-center text-center pr-3 border-l-2 border-emerald-500 transition-colors duration-500";
      endcapText.className = "text-emerald-600 transition-colors duration-500";
      
      shelfBar.className = "relative w-[calc(100%-24px)] self-start h-[52px] bg-gradient-to-r from-emerald-600 via-emerald-500 to-emerald-600 rounded-b-xl shelf-glow flex items-center justify-between px-6 z-10 border-t-2 border-emerald-300/50 -mt-0.5 transition-colors duration-500";
      
      // Fire Confetti only ONCE when status transitions to sold
      if (previousStatus !== 'sold') {
        const duration = 3000;
        const end = Date.now() + duration;

        (function frame() {
          confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0, y: 0.8 }, colors: ['#10b981', '#3b82f6', '#f59e0b', '#ffffff'] });
          confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1, y: 0.8 }, colors: ['#10b981', '#3b82f6', '#f59e0b', '#ffffff'] });
          if (Date.now() < end) requestAnimationFrame(frame);
        }());
      }
      
    } else if (data.status === 'unsold') {
      // Apply Unsold Visuals (Red/Gray Theme)
      playerPhoto.classList.add('player-grayscale');
      statusText.textContent = 'UNSOLD';
      statusStamp.className = "absolute bottom-2 right-2 bg-gradient-to-r from-rose-700 to-red-600 px-3 py-0.5 rounded shadow-lg border border-red-200/50 transform -rotate-3 transition-colors duration-500";
      
      livePillBg.className = "flex items-center gap-2 bg-[#4c0519] border border-red-400/60 py-1.5 px-4 rounded-full shadow-md flex-shrink-0 transition-colors duration-500";
      livePillText.textContent = "PLAYER UNSOLD";
      
      bidLabelText.textContent = "UNSOLD";
      bidLabelText.className = "text-[10px] font-extrabold uppercase tracking-[0.25em] text-red-400 mt-2 mb-0.5 transition-colors duration-500";
      
      bidCountingBg.className = "mt-2 w-[85%] bg-red-700 py-0.5 px-2 rounded-full border border-red-300/40 shadow-sm flex items-center justify-center transition-all duration-500";
      bidCountingText.textContent = "RETURNED TO POOL";
      
      podOuter.className = "relative w-[198px] h-[198px] rounded-full p-[6px] bg-gradient-to-b from-red-500 via-red-700 to-red-900 pod-orbit-glow flex items-center justify-center transition-colors duration-500";
      orbitRing.className = "absolute w-[212px] h-[212px] rounded-full border-2 border-red-600 border-dashed animate-[spin_45s_linear_infinite] opacity-70 pointer-events-none transition-colors duration-500";
      gavelBadge.className = "absolute -top-3 w-8 h-8 rounded-full bg-gradient-to-tr from-red-600 to-red-500 border-2 border-white flex items-center justify-center shadow-lg transition-colors duration-500";
      
      rightWing.className = "relative flex-1 bg-gradient-to-r from-[#4c0519] via-[#22020a] to-[#4c0519] clip-right-wing pl-10 pr-24 flex items-center justify-between border-t-2 border-b-2 border-red-600 shadow-[0_10px_25px_rgba(0,0,0,0.8)] z-10 transition-colors duration-500";
      rwLine1.className = "h-[1.5px] w-6 bg-red-600 transition-colors duration-500";
      rwLine2.className = "h-[1.5px] w-6 bg-red-600 transition-colors duration-500";
      rwLabel.className = "text-[10px] font-black uppercase tracking-[0.25em] text-red-400 transition-colors duration-500";
      
      endcap.className = "absolute right-0 top-0 bottom-0 w-[90px] bg-[#f8fafc] clip-endcap flex flex-col items-center justify-center text-center pr-3 border-l-2 border-red-600 transition-colors duration-500";
      endcapText.className = "text-red-600 transition-colors duration-500";
      
      shelfBar.className = "relative w-[calc(100%-24px)] self-start h-[52px] bg-gradient-to-r from-red-700 via-rose-600 to-red-700 rounded-b-xl shelf-glow flex items-center justify-between px-6 z-10 border-t-2 border-red-300/50 -mt-0.5 transition-colors duration-500";
      
    } else {
      // Active State (Default Orange/Brand Theme)
      playerPhoto.classList.remove('player-grayscale');
      statusText.textContent = 'Play Bid Believe';
      statusStamp.className = "absolute bottom-2 right-2 bg-gradient-to-r from-[#ea580c] to-[#ff7a00] px-3 py-0.5 rounded shadow-lg border border-amber-200/50 transform -rotate-3 transition-colors duration-500";
      
      livePillBg.className = "flex items-center gap-2 bg-[#09101a] border border-amber-400/60 py-1.5 px-4 rounded-full shadow-md flex-shrink-0 transition-colors duration-500";
      livePillText.textContent = "LIVE AUCTION";
      liveDot.className = "relative inline-flex rounded-full h-2.5 w-2.5 bg-red-600 shadow-[0_0_8px_#ff0000] live-dot-pulse transition-colors duration-500";
      liveDot.previousElementSibling.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-red-500 opacity-75";
      
      bidLabelText.textContent = "CURRENT BID";
      bidLabelText.className = "text-[10px] font-extrabold uppercase tracking-[0.25em] text-[#ff8d36] mt-2 mb-0.5 transition-colors duration-500";
      
      bidCountingBg.className = "mt-2 w-[85%] hazard-stripes py-0.5 px-2 rounded-full border border-amber-300/40 shadow-sm flex items-center justify-center transition-all duration-500";
      bidCountingText.textContent = "AND COUNTING...";
      
      podOuter.className = "relative w-[198px] h-[198px] rounded-full p-[6px] bg-gradient-to-b from-[#ff8533] via-[#ea580c] to-[#9a3412] pod-orbit-glow flex items-center justify-center transition-colors duration-500";
      orbitRing.className = "absolute w-[212px] h-[212px] rounded-full border-2 border-[#ea580c] border-dashed animate-[spin_45s_linear_infinite] opacity-70 pointer-events-none transition-colors duration-500";
      gavelBadge.className = "absolute -top-3 w-8 h-8 rounded-full bg-gradient-to-tr from-[#ea580c] to-[#ff7a00] border-2 border-white flex items-center justify-center shadow-lg transition-colors duration-500";
      
      rightWing.className = "relative flex-1 bg-gradient-to-r from-[#0a0f1d] via-[#0d1627] to-[#080d19] clip-right-wing pl-10 pr-24 flex items-center justify-between border-t-2 border-b-2 border-[#ea580c] shadow-[0_10px_25px_rgba(0,0,0,0.8)] z-10 transition-colors duration-500";
      rwLine1.className = "h-[1.5px] w-6 bg-[#ea580c] transition-colors duration-500";
      rwLine2.className = "h-[1.5px] w-6 bg-[#ea580c] transition-colors duration-500";
      rwLabel.className = "text-[10px] font-black uppercase tracking-[0.25em] text-[#ff8d36] transition-colors duration-500";
      
      endcap.className = "absolute right-0 top-0 bottom-0 w-[90px] bg-[#f8fafc] clip-endcap flex flex-col items-center justify-center text-center pr-3 border-l-2 border-[#ea580c] transition-colors duration-500";
      endcapText.className = "text-[#ea580c] transition-colors duration-500";
      
      shelfBar.className = "relative w-[calc(100%-24px)] self-start h-[52px] bg-gradient-to-r from-[#ea580c] via-[#ff6a00] to-[#ea580c] rounded-b-xl shelf-glow flex items-center justify-between px-6 z-10 border-t-2 border-amber-300/50 -mt-0.5 transition-colors duration-500";
    }

    previousStatus = data.status;
  }

  // Poll the live endpoint
  let pollingInterval = null;

  async function fetchLiveData() {
    if (!auctionCode) return;
    try {
      const res  = await fetch(`${API_BASE}/auctions/${auctionCode}/live`, { cache: 'no-store' });
      const data = await res.json();
      updateOverlay(data);
    } catch (err) {
      console.warn('Overlay: live fetch error', err);
    }
  }

  // Fetch basic tournament details (name and logo) once on load
  async function fetchTournamentData() {
    if (!auctionCode) return;
    try {
      const res = await fetch(`${API_BASE}/auctions/${auctionCode}`);
      const auction = await res.json();
      if (!auction.error) {
        // Name — two-colour split
        const words = (auction.name || 'CRIC SQUAD').toUpperCase().split(' ');
        let name1, name2;
        if (words.length > 1) {
            name2 = words.pop();
            name1 = words.join(' ');
        } else {
            name1 = words[0];
            name2 = '';
        }
        
        document.getElementById('overlayTournamentName1').textContent = name1;
        document.getElementById('overlayTournamentName2').textContent = name2;
        
        const logoContainer = document.getElementById('overlayTournamentLogoContainer');
        if (logoContainer && auction.logo_url) {
          logoContainer.innerHTML = `<img src="${auction.logo_url}" alt="Tournament Logo" class="w-full h-full object-contain filter drop-shadow-[0_4px_10px_rgba(0,0,0,0.2)]">`;
        }
      }
    } catch(err) {
      console.warn("Could not fetch tournament data", err);
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    scaleOverlay();

    if (auctionCode) {
      fetchTournamentData(); // One-time fetch for name/logo
      fetchLiveData(); // immediate first paint
      pollingInterval = setInterval(fetchLiveData, 100); // poll every 100 ms
      console.log('Overlay connected to auction:', auctionCode);
    } else {
      console.warn('No auction code in URL. Use ?code=YOUR_CODE');
    }
  });
</script>
</body>
