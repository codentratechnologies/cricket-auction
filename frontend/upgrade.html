<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upgrade Plan - Cricsquad</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/upgrade.css">
</head>
<body>

    <div class="upgrade-container">
        <div class="upgrade-box">
            <a href="auction-dashboard.html" class="close-modal"><i class="fa-solid fa-xmark"></i></a>
            <div class="upgrade-header">
                <h2><i class="fa-solid fa-crown" style="color: #1D4ED8;"></i> Upgrade Your Plan</h2>
                <p>Choose the perfect plan for your tournament.<br>Unlock more teams to scale your auction to the next level!</p>
            </div>
            
            <div class="upgrade-grid">
                <!-- Starter Plan -->
                <div class="plan-card current" style="--theme: #3b82f6; --theme-bg: #eff6ff;">
                    <div class="current-badge"><i class="fa-solid fa-check"></i> Current</div>
                    <div class="plan-icon"><i class="fa-solid fa-trophy"></i></div>
                    <h3>Starter</h3>
                    <div class="plan-teams">3 Teams</div>
                    <div class="plan-price">₹ Free</div>
                    <button class="btn-current-plan"><i class="fa-solid fa-check"></i> Current Plan</button>
                </div>
                
                <!-- Challenger Plan -->
                <div class="plan-card" style="--theme: #8b5cf6; --theme-bg: #f3e8ff;">
                    <div class="plan-icon"><i class="fa-solid fa-trophy"></i></div>
                    <h3>Challenger</h3>
                    <div class="plan-teams">4 Teams</div>
                    <div class="plan-price">₹ 1,999</div>
                    <button class="btn-upgrade">Upgrade</button>
                </div>
                
                <!-- Pro Plan -->
                <div class="plan-card" style="--theme: #1D4ED8; --theme-bg: #dbeafe;">
                    <div class="plan-icon"><i class="fa-solid fa-trophy"></i></div>
                    <h3>Pro</h3>
                    <div class="plan-teams">6 Teams</div>
                    <div class="plan-price">₹ 2,499</div>
                    <button class="btn-upgrade">Upgrade</button>
                </div>
                
                <!-- Elite Plan -->
                <div class="plan-card" style="--theme: #06b6d4; --theme-bg: #cffafe;">
                    <div class="plan-icon"><i class="fa-solid fa-trophy"></i></div>
                    <h3>Elite</h3>
                    <div class="plan-teams">8 Teams</div>
                    <div class="plan-price">₹ 2,999</div>
                    <button class="btn-upgrade">Upgrade</button>
                </div>
                
                <!-- Master Plan -->
                <div class="plan-card" style="--theme: #a855f7; --theme-bg: #f3e8ff;">
                    <div class="plan-icon"><i class="fa-solid fa-trophy"></i></div>
                    <h3>Master</h3>
                    <div class="plan-teams">12 Teams</div>
                    <div class="plan-price">₹ 3,999</div>
                    <button class="btn-upgrade">Upgrade</button>
                </div>
                
                <!-- Legend Plan -->
                <div class="plan-card" style="--theme: #eab308; --theme-bg: #fef9c3;">
                    <div class="plan-icon"><i class="fa-solid fa-trophy"></i></div>
                    <h3>Legend</h3>
                    <div class="plan-teams">16 Teams</div>
                    <div class="plan-price">₹ 4,999</div>
                    <button class="btn-upgrade">Upgrade</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
